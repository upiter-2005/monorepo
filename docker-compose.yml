services:
  postgres:
    image: postgres:17
    container_name: nx-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nx-backend
    command: npx nx serve api
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://devuser:devpass@postgres:5432/mydb
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nx-frontend
    command: npx nx serve web --host=0.0.0.0
    ports:
      - '4200:4200'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
volumes:
  postgres_data:
