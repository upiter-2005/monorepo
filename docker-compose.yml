services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: nx-backend
    command: npx nx serve api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nx-frontend
    command: npx nx serve web --host=0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development